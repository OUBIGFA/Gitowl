name: Repository check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  repository:
    name: Repository hygiene
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Check staged repository snapshot
        run: python tools/check_repo.py
      - name: Test repository checker
        run: python -m unittest discover -s tests/repository -v
