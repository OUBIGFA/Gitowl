name: ⭐ Feature Request
description: Submit a Gitowl feature request
body:
  - type: markdown
    attributes:
      value: |
        Thanks for submitting a Gitowl feature request. Search existing issues before opening a new request.
  - type: textarea
    id: the-feature-request
    attributes:
      label: The feature request
      description: Describe the user problem or capability you want to add.
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed solution
      description: Explain how the proposal preserves or extends the upstream feature entry points.
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Include screenshots, mockups, links, or other relevant context.
