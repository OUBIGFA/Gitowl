name: 🐛 Bug Report
description: File a Gitowl bug report
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities in a public issue. Follow the [security policy](https://github.com/OUBIGFA/Gitowl/security/policy) instead.

        Thanks for filing a Gitowl bug report. Search existing issues before opening a new report.
  - type: textarea
    id: the-problem
    attributes:
      label: The problem
      description:
        Describe what you tried, what happened, and any visible error message.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Release or commit version
      description: Enter the Gitowl version or commit you tested.
    validations:
      required: true
  - type: input
    id: operating-system
    attributes:
      label: Operating system
      description: Enter the operating system and version.
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce the behavior
      description: Provide clear steps that reproduce the problem.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
  - type: textarea
    id: logs
    attributes:
      label: Log files
      description: Remove credentials and private data before attaching logs.
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Add screenshots when they clarify the problem.
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add other relevant context, links, or reproduction material.
